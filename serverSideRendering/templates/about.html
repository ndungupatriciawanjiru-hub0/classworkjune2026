<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>About Our Clients</title>
</head>
<body>
    <h1>About Our Clients</h1>
    <ul>
    {% for client in clients %}
        <li>
            <strong>{{ client.name }}</strong> —
            {{ client.industry }} —
            Status: {{ client.status }} —
            ARR: ${{ client.arr }}
        </li>
    {% endfor %}
    </ul>
</body>
</html>
